upstream femantic_frontend {
    server 127.0.0.1:3100;
}

upstream femantic_backend {
    server 127.0.0.1:8100;
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.globalcareerhub.org 136.244.78.245;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://femantic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /tracker/ {
        proxy_pass http://femantic_backend/tracker/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /femantic.js {
        proxy_pass http://femantic_backend/femantic.js;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
    }

    location /health {
        proxy_pass http://femantic_backend/health;
    }

    location / {
        proxy_pass http://femantic_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
